<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>停车场找车位</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 60%, #90ee90 60%, #7ccd7c 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
  }

  /* 顶部按钮区 */
  .top-bar {
    position: absolute;
    top: 16px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 50;
  }
  .top-btn {
    padding: 8px 14px;
    background: #fff;
    border: 3px solid #5d4037;
    border-radius: 24px;
    font-size: 14px; font-weight: 700;
    color: #5d4037;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 3px 0 #5d4037;
  }
  .top-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #5d4037; }
  .top-btn.on { background: #fff59d; }
  .top-btn.off { opacity: 0.55; }

  .title {
    text-align: center;
    font-size: 22px; font-weight: 900;
    color: #fff;
    text-shadow: 2px 2px 0 #5b8cbe;
    margin-top: 8px;
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    white-space: nowrap;
  }

  /* 关卡显示 */
  .level-badge {
    position: absolute;
    top: 50px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    padding: 6px 18px;
    border-radius: 18px;
    border: 3px solid #5d4037;
    font-size: 14px; font-weight: 900;
    color: #5d4037;
    z-index: 10;
    white-space: nowrap;
  }
  .level-badge .stars {
    color: #ff7043;
    margin-left: 6px;
    letter-spacing: 2px;
  }

  /* 车位区 */
  .parking-area {
    position: absolute;
    top: 150px; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 600px;
    height: 220px;
    display: flex; align-items: center; justify-content: center;
  }

  .spot {
    position: relative;
    width: 200px; height: 200px;
    background: linear-gradient(180deg, #5d4037 0%, #3e2723 100%);
    border: 5px solid #2c1810;
    border-radius: 18px;
    box-shadow:
      inset 0 0 0 8px #6d4c41,
      inset 0 -16px 0 rgba(0,0,0,0.4),
      0 10px 0 #2c1810,
      0 14px 24px rgba(0,0,0,0.4);
  }
  .spot::before {
    /* 中线 */
    content: ""; position: absolute;
    top: 10px; bottom: 10px; left: 50%;
    width: 4px;
    background: repeating-linear-gradient(180deg, #ffeb3b 0, #ffeb3b 12px, transparent 12px, transparent 22px);
    transform: translateX(-50%);
    opacity: 0.7;
  }
  .spot::after {
    /* P 字 */
    content: "P"; position: absolute;
    top: 12px; left: 14px;
    font-size: 28px; font-weight: 900;
    color: rgba(255,255,255,0.15);
  }

  /* 车位号牌（汉字数字） */
  .spot .label {
    position: absolute;
    top: -28px; left: 50%;
    transform: translateX(-50%);
    transition: top 0.5s ease-out, opacity 0.5s ease-out;
    min-width: 90px; height: 56px;
    background: linear-gradient(180deg, #fff 0%, #fff8e1 100%);
    border: 4px solid #5d4037;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 900;
    color: #d35400;
    text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    box-shadow: 0 4px 0 #5d4037;
    padding: 0 16px;
  }
  .spot.highlight {
    background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%);
    border-color: #1b5e20;
    animation: spot-glow 0.8s ease-in-out infinite;
  }
  @keyframes spot-glow {
    0%, 100% { box-shadow: inset 0 0 0 8px #4caf50, inset 0 -16px 0 rgba(0,0,0,0.4), 0 10px 0 #1b5e20, 0 0 0 0 rgba(76,175,80,0.7); }
    50%      { box-shadow: inset 0 0 0 8px #4caf50, inset 0 -16px 0 rgba(0,0,0,0.4), 0 10px 0 #1b5e20, 0 0 0 18px rgba(76,175,80,0); }
  }
  .spot.occupied {
    background: linear-gradient(180deg, #4e342e 0%, #3e2723 100%);
  }
  .spot.occupied .label { opacity: 0; }

  /* label 进场：从 spot 内部中央清 0 滑上来到顶都 -28px */
  .spot .label.entering {
    top: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.6);
  }

  /* 道路 */
  .road-area {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 230px;
    background: linear-gradient(180deg, transparent 0%, transparent 18%, #616161 18%, #424242 100%);
  }
  .road-area::before {
    content: ""; position: absolute;
    top: 38px; left: 0; right: 0;
    height: 6px;
    background: repeating-linear-gradient(90deg, transparent 0, transparent 28px, #ffeb3b 28px, #ffeb3b 56px);
  }

  .cars-row {
    position: absolute;
    bottom: 24px; left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 22px;
    padding: 0 16px;
    flex-wrap: wrap;
  }

  /* 单个小车按钮 */
  .car-card {
    position: relative;
    width: 130px; height: 130px;
    cursor: pointer;
    z-index: 10;
    transition: transform 0.15s;
  }
  .car-card:active { transform: scale(0.92); }
  .car-card.flying {
    transition: all 0.7s cubic-bezier(0.5, 1.5, 0.3, 1);
    z-index: 1000;
    pointer-events: none;
  }
  .car-card.parked {
    position: absolute;
    width: 130px; height: 130px;
    overflow: visible;
    z-index: 30;
  }
  .car-card.shake { animation: shake 0.5s; }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-10px) rotate(-4deg)}
    40%{transform:translateX(10px) rotate(4deg)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }
  .car-card.gone { opacity: 0; pointer-events: none; }

  /* ===== 10 种车辆造型 ===== */
  /* 通用：车身阴影 */
  .car-card .vehicle {
    position: absolute;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 76px;
  }

  /* 轮子（通用） */
  .car-card .wheel {
    position: absolute;
    bottom: 6px;
    width: 22px; height: 22px;
    background: radial-gradient(circle, #616161 25%, #212121 60%, #424242 100%);
    border: 3px solid #1a1a1a;
    border-radius: 50%;
    z-index: 3;
  }
  .car-card .wheel::before {
    content: ""; position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 8px; height: 8px;
    background: #fdd835;
    border-radius: 50%;
  }
  .car-card .wheel.l { left: 14px; }
  .car-card .wheel.r { right: 14px; }

  /* 车牌：阿拉伯数字 */
  .car-card .plate {
    position: absolute;
    bottom: -2px; left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 3px solid #5d4037;
    border-radius: 8px;
    padding: 4px 12px;
    font-size: 20px; font-weight: 900;
    color: #d35400;
    box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    z-index: 4;
    white-space: nowrap;
  }

  /* ---- 1. 小汽车 ---- */
  .car-card.v-car .vehicle {
    background: linear-gradient(180deg, #66bb6a 0%, #2e7d32 70%, #1b5e20 100%);
    border: 3px solid #1b5e20;
    border-radius: 14px 14px 6px 6px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15), inset 0 4px 0 rgba(255,255,255,0.3);
  }
  .car-card.v-car .vehicle::before {
    content: ""; position: absolute;
    bottom: 36px; left: 18px; right: 18px; height: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0.45));
    border: 3px solid #1b5e20;
    border-radius: 10px 10px 0 0;
  }
  .car-card.v-car .vehicle::after {
    content: ""; position: absolute;
    bottom: 8px; left: 8px; right: 8px; height: 8px;
    background: #5d4037;
    border-radius: 3px;
  }

  /* ---- 2. 消防车 ---- */
  .car-card.v-fire .vehicle {
    background: linear-gradient(180deg, #ef5350 0%, #c62828 70%, #8e0000 100%);
    border: 3px solid #5d0000;
    border-radius: 8px 8px 6px 6px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
  }
  .car-card.v-fire .ladder {
    position: absolute;
    top: -6px; left: 10px; right: 10px;
    height: 8px;
    background: repeating-linear-gradient(90deg, #5d4037 0, #5d4037 5px, transparent 5px, transparent 9px);
    border: 2px solid #5d4037;
    border-radius: 3px;
  }
  .car-card.v-fire .siren {
    position: absolute;
    top: -8px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 10px;
    background: linear-gradient(90deg, #42a5f5 50%, #ef5350 50%);
    border: 2px solid #5d0000;
    border-radius: 4px;
    animation: siren-blink 0.5s linear infinite;
  }
  @keyframes siren-blink {
    0%, 100% { background: linear-gradient(90deg, #42a5f5 50%, #ef5350 50%); }
    50%      { background: linear-gradient(90deg, #ef5350 50%, #42a5f5 50%); }
  }
  .car-card.v-fire .window {
    position: absolute;
    bottom: 38px; left: 12px; right: 12px; height: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0.45));
    border: 3px solid #5d0000;
    border-radius: 8px 8px 0 0;
  }

  /* ---- 3. 警车 ---- */
  .car-card.v-police .vehicle {
    background: linear-gradient(180deg, #fff 0%, #f5f5f5 70%, #e0e0e0 100%);
    border: 3px solid #424242;
    border-radius: 14px 14px 6px 6px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.1);
  }
  .car-card.v-police .stripe {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 14px;
    background: linear-gradient(90deg, #1976d2 0%, #1976d2 45%, #fff 45%, #fff 55%, #1976d2 55%, #1976d2 100%);
  }
  .car-card.v-police .siren {
    position: absolute;
    top: -8px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 10px;
    background: linear-gradient(90deg, #ef5350 50%, #42a5f5 50%);
    border: 2px solid #424242;
    border-radius: 4px;
    animation: siren-blink 0.4s linear infinite;
  }
  .car-card.v-police .top {
    position: absolute;
    bottom: 38px; left: 18px; right: 18px; height: 24px;
    background: linear-gradient(180deg, rgba(180,220,255,0.9), rgba(120,180,255,0.5));
    border: 3px solid #424242;
    border-radius: 8px 8px 0 0;
  }

  /* ---- 4. 巴士 ---- */
  .car-card.v-bus .vehicle {
    background: linear-gradient(180deg, #ffd54f 0%, #f57c00 70%, #e65100 100%);
    border: 3px solid #bf360c;
    border-radius: 16px 16px 6px 6px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
  }
  .car-card.v-bus .window {
    position: absolute;
    bottom: 36px; left: 8px; right: 8px; height: 28px;
    background: linear-gradient(180deg, rgba(180,220,255,0.85), rgba(180,220,255,0.5));
    border: 3px solid #bf360c;
    border-radius: 8px;
  }
  .car-card.v-bus .window::before,
  .car-card.v-bus .window::after {
    content: ""; position: absolute;
    top: 2px; bottom: 2px;
    width: 2px;
    background: #bf360c;
  }
  .car-card.v-bus .window::before { left: 35%; }
  .car-card.v-bus .window::after  { left: 70%; }
  .car-card.v-bus .door {
    position: absolute;
    bottom: 8px; left: 8px;
    width: 14px; height: 24px;
    background: #5d2e0d;
    border-radius: 3px;
  }

  /* ---- 5. 救护车 ---- */
  .car-card.v-ambulance .vehicle {
    background: linear-gradient(180deg, #fff 0%, #fafafa 100%);
    border: 3px solid #c62828;
    border-radius: 8px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.1);
  }
  .car-card.v-ambulance .stripe {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 20px;
    background: linear-gradient(90deg, #c62828 0%, #c62828 30%, #fff 30%, #fff 50%, #c62828 50%, #c62828 70%, #fff 70%, #fff 100%);
  }
  .car-card.v-ambulance .cross {
    position: absolute;
    bottom: 26px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 22px;
    background: #fff;
    border: 2px solid #c62828;
    border-radius: 4px;
  }
  .car-card.v-ambulance .cross::before,
  .car-card.v-ambulance .cross::after {
    content: ""; position: absolute;
    background: #c62828;
  }
  .car-card.v-ambulance .cross::before {
    top: 4px; bottom: 4px; left: 50%;
    width: 4px; transform: translateX(-50%);
  }
  .car-card.v-ambulance .cross::after {
    left: 4px; right: 4px; top: 50%;
    height: 4px; transform: translateY(-50%);
  }
  .car-card.v-ambulance .top {
    position: absolute;
    bottom: 50px; left: 14px; right: 14px; height: 18px;
    background: linear-gradient(180deg, rgba(180,220,255,0.85), rgba(180,220,255,0.5));
    border: 3px solid #c62828;
    border-radius: 8px 8px 0 0;
  }

  /* ---- 6. 卡车 ---- */
  .car-card.v-truck .vehicle {
    background: linear-gradient(180deg, #42a5f5 0%, #1976d2 70%, #0d47a1 100%);
    border: 3px solid #0d2c5c;
    border-radius: 4px 4px 6px 6px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
  }
  .car-card.v-truck .cargo {
    position: absolute;
    bottom: 12px; left: 8px;
    width: 60px; height: 56px;
    background: linear-gradient(180deg, #bcaaa4 0%, #8d6e63 100%);
    border: 3px solid #5d4037;
    border-radius: 4px;
  }
  .car-card.v-truck .cargo::before {
    content: ""; position: absolute;
    inset: 4px;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 8px, #5d4037 8px, #5d4037 9px);
    opacity: 0.5;
  }
  .car-card.v-truck .cab {
    position: absolute;
    bottom: 12px; right: 8px;
    width: 32px; height: 56px;
    background: linear-gradient(180deg, #42a5f5 0%, #1976d2 100%);
    border: 3px solid #0d2c5c;
    border-radius: 6px 6px 0 0;
  }
  .car-card.v-truck .cab::before {
    content: ""; position: absolute;
    top: 6px; left: 4px; right: 4px; height: 12px;
    background: linear-gradient(180deg, rgba(180,220,255,0.85), rgba(180,220,255,0.5));
    border-radius: 4px;
  }

  /* ---- 7. 挖掘机 ---- */
  .car-card.v-excavator .vehicle {
    background: linear-gradient(180deg, #ffd54f 0%, #f57c00 70%, #e65100 100%);
    border: 3px solid #bf360c;
    border-radius: 8px 8px 6px 6px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
  }
  .car-card.v-excavator .cabin {
    position: absolute;
    bottom: 14px; right: 6px;
    width: 28px; height: 50px;
    background: linear-gradient(180deg, rgba(180,220,255,0.9), rgba(180,220,255,0.6));
    border: 3px solid #bf360c;
    border-radius: 5px;
  }
  .car-card.v-excavator .arm {
    position: absolute;
    bottom: 30px; left: 8px;
    width: 50px; height: 8px;
    background: linear-gradient(180deg, #ffd54f, #f57c00);
    border: 2px solid #bf360c;
    border-radius: 4px;
    transform: rotate(-15deg);
    transform-origin: right center;
  }
  .car-card.v-excavator .arm::before {
    content: ""; position: absolute;
    left: -16px; top: -8px;
    width: 18px; height: 22px;
    background: linear-gradient(180deg, #5d4037 0%, #3e2723 100%);
    border: 2px solid #bf360c;
    border-radius: 3px 3px 8px 3px;
  }

  /* ---- 8. 拖拉机 ---- */
  .car-card.v-tractor .vehicle {
    background: linear-gradient(180deg, #ef5350 0%, #c62828 70%, #8e0000 100%);
    border: 3px solid #5d0000;
    border-radius: 8px 8px 6px 6px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
  }
  .car-card.v-tractor .big-wheel {
    position: absolute;
    bottom: 4px; left: 4px;
    width: 30px; height: 30px;
    background: radial-gradient(circle, #616161 25%, #212121 60%, #424242 100%);
    border: 4px solid #1a1a1a;
    border-radius: 50%;
    z-index: 3;
  }
  .car-card.v-tractor .big-wheel::before {
    content: ""; position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 10px; height: 10px;
    background: #fdd835;
    border-radius: 50%;
  }
  .car-card.v-tractor .smoke {
    position: absolute;
    top: -10px; left: 18px;
    width: 14px; height: 14px;
    background: rgba(80,80,80,0.7);
    border-radius: 50%;
    box-shadow: -6px 6px 0 rgba(80,80,80,0.5), -10px 14px 0 rgba(80,80,80,0.3);
  }
  .car-card.v-tractor .chimney {
    position: absolute;
    top: -4px; left: 18px;
    width: 14px; height: 14px;
    background: #424242;
    border: 2px solid #1a1a1a;
    border-radius: 3px;
  }

  /* ---- 9. 油罐车 ---- */
  .car-card.v-tanker .vehicle {
    background: transparent;
  }
  .car-card.v-tanker .tank {
    position: absolute;
    bottom: 14px; left: 8px;
    width: 70px; height: 50px;
    background: linear-gradient(180deg, #ef5350 0%, #c62828 70%, #8e0000 100%);
    border: 3px solid #5d0000;
    border-radius: 30px / 20px;
  }
  .car-card.v-tanker .tank::before {
    content: ""; position: absolute;
    inset: 6px;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 12px, rgba(255,255,255,0.3) 12px, rgba(255,255,255,0.3) 13px);
    border-radius: inherit;
  }
  .car-card.v-tanker .cab {
    position: absolute;
    bottom: 14px; right: 8px;
    width: 24px; height: 50px;
    background: linear-gradient(180deg, #fff 0%, #e0e0e0 100%);
    border: 3px solid #424242;
    border-radius: 6px 6px 0 0;
  }

  /* ---- 10. 出租车 ---- */
  .car-card.v-taxi .vehicle {
    background: linear-gradient(180deg, #ffd54f 0%, #f9a825 70%, #f57f17 100%);
    border: 3px solid #e65100;
    border-radius: 14px 14px 6px 6px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
  }
  .car-card.v-taxi .sign {
    position: absolute;
    top: -8px; left: 50%; transform: translateX(-50%);
    width: 24px; height: 14px;
    background: #fff;
    border: 2px solid #e65100;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900;
    color: #e65100;
  }
  .car-card.v-taxi .top {
    position: absolute;
    bottom: 36px; left: 18px; right: 18px; height: 26px;
    background: linear-gradient(180deg, rgba(180,220,255,0.85), rgba(180,220,255,0.5));
    border: 3px solid #e65100;
    border-radius: 8px 8px 0 0;
  }

  /* 星星 */
  .star {
    position: fixed;
    pointer-events: none;
    font-size: 42px;
    animation: star-rise 1.4s ease-out forwards;
    z-index: 200;
  }
  @keyframes star-rise {
    0%   { transform: translate(-50%, 0) scale(0.3) rotate(0); opacity: 1; }
    100% { transform: translate(-50%, -240px) scale(1.6) rotate(360deg); opacity: 0; }
  }

  /* 大烟花 */
  .big-star {
    position: fixed;
    pointer-events: none;
    font-size: 96px;
    animation: big-bounce 1.6s ease-out forwards;
    z-index: 200;
  }
  @keyframes big-bounce {
    0%   { transform: translate(-50%, 0) scale(0); opacity: 1; }
    40%  { transform: translate(-50%, -180px) scale(1.4); opacity: 1; }
    70%  { transform: translate(-50%, -180px) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -300px) scale(0.6); opacity: 0; }
  }

  /* 庆祝撒花 */
  .confetti {
    position: fixed;
    pointer-events: none;
    width: 12px; height: 16px;
    animation: confetti 1.6s ease-out forwards;
    z-index: 200;
  }
  @keyframes confetti {
    0%   { transform: translate(0,0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx), 60vh) rotate(720deg); opacity: 0; }
  }

  /* 总通关弹层 */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center; justify-content: center;
    z-index: 300;
  }
  .overlay.show { display: flex; }
  .overlay .card {
    background: linear-gradient(180deg, #fff8e1 0%, #ffe0b2 100%);
    border: 5px solid #5d4037;
    border-radius: 28px;
    padding: 36px 40px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    max-width: 360px;
  }
  .overlay h2 { margin: 0 0 10px; font-size: 32px; color: #bf360c; }
  .overlay .stars-row { font-size: 32px; margin: 8px 0 12px; letter-spacing: 4px; }
  .overlay p  { margin: 0 0 20px; font-size: 16px; color: #5d4037; }
  .overlay button {
    padding: 12px 28px;
    background: #ff7043;
    color: white;
    border: 4px solid #5d2e0d;
    border-radius: 24px;
    font-size: 18px; font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 0 #bf360c;
    margin: 4px;
  }
  .overlay button:active { transform: translateY(3px); box-shadow: 0 2px 0 #bf360c; }
  .overlay button.secondary {
    background: #fff;
    color: #5d4037;
    border-color: #5d4037;
    box-shadow: 0 5px 0 #5d4037;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <a class="top-btn" href="../../">← 回家</a>
    <button class="top-btn off" id="soundToggle">🔇 声音</button>
  </div>

  <h1 class="title">🅿️ 停车场找车位</h1>
  <div class="level-badge">第 <span id="levelNum">1</span> 关<span class="stars" id="stars"></span></div>
  <div class="hint" id="hint" style="display:none"></div>

  <div class="parking-area">
    <div class="spot" id="spot">
      <div class="label">一</div>
    </div>
  </div>

  <div class="road-area">
    <div class="cars-row" id="carsRow"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h2>🎉 太棒啦！</h2>
      <div class="stars-row">⭐⭐⭐⭐⭐</div>
      <p>10 关全部完成！小朋友超级厉害～</p>
      <button id="againBtn">再玩一次 🚗</button>
      <br>
      <button class="secondary" onclick="window.location.href='../../'">回家看看</button>
    </div>
  </div>

<script>
(function(){
  // ============ 配置 ============
  // 汉字数字
  const CHINESE = ['一','二','三','四','五','六','七','八','九','十'];
  const TOTAL = 10;             // 总关数
  const TOTAL_STARS = 3;        // 每关最多 3 星（首关 3，二关 2，三关 1…）

  // 10 种车辆造型
  const VEHICLES = [
    'v-car',         // 1 小汽车
    'v-fire',        // 2 消防车
    'v-police',      // 3 警车
    'v-bus',         // 4 巴士
    'v-ambulance',   // 5 救护车
    'v-truck',       // 6 卡车
    'v-excavator',   // 7 挖掘机
    'v-tractor',     // 8 拖拉机
    'v-tanker',      // 9 油罐车
    'v-taxi',        // 10 出租车
  ];

  // 每关用哪辆车（按数字选，10 辆车正好配 10 关）
  function vehicleFor(n) { return VEHICLES[(n - 1) % VEHICLES.length]; }

  // ============ DOM ============
  const carsRow = document.getElementById('carsRow');
  const spot = document.getElementById('spot');
  const hintEl = document.getElementById('hint');
  const overlay = document.getElementById('overlay');
  const againBtn = document.getElementById('againBtn');
  const levelNumEl = document.getElementById('levelNum');
  const starsEl = document.getElementById('stars');
  const soundToggle = document.getElementById('soundToggle');

  let soundOn = false;          // 默认关闭
  let busy = false;
  let currentNum = 1;           // 当前关卡的"阿拉伯数字"
  let correctCount = 0;
  let finaleCars = [];          // 通关后转圈的车，againBtn/回家 时清掉

  // ============ 工具 ============
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 从 1-10 抽 N 个不等于 target 的数
  function pickDistractors(target, n) {
    const pool = [];
    for (let i = 1; i <= 10; i++) {
      if (i !== target) pool.push(i);
    }
    return shuffle(pool).slice(0, n);
  }

  // ============ 声音（TTS + Web Audio 兑底）============
  let _ttsBroken = false;
  let _audioCtx = null;
  function _getCtx() {
    if (!_audioCtx) {
      try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ _audioCtx = null; }
    }
    return _audioCtx;
  }
  function _tone(when, freq, dur, vol, type) {
    const ctx = _getCtx(); if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, when);
    gain.gain.linearRampToValueAtTime(vol || 0.4, when + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, when + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(when); osc.stop(when + dur + 0.05);
  }
  function speak(text, lang) {
    if (!soundOn) return;
    if ('speechSynthesis' in window && !_ttsBroken) {
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang || 'zh-CN';
        u.rate = 1.0; u.pitch = 1.3;
        u.onerror = () => { _ttsBroken = true; };
        window.speechSynthesis.speak(u);
        return;
      } catch(e) { _ttsBroken = true; }
    }
    // 兑底
    const ctx = _getCtx(); if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    _tone(now, 523, 0.12, 0.4);
    if (lang === 'en-US') _tone(now + 0.12, 659, 0.18, 0.4);
    else _tone(now + 0.13, 659, 0.18, 0.4);
  }

  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? '🔊 声音' : '🔇 声音';
    soundToggle.classList.toggle('off', !soundOn);
    soundToggle.classList.toggle('on', soundOn);
    if (!soundOn) {
      try { window.speechSynthesis.cancel(); } catch(e){}
    }
  });

  // ============ 主流程 ============
  function startLevel() {
    busy = false;
    // 顺序：先决定关卡数字，再清场 + 重建 label
    currentNum = correctCount + 1;

    carsRow.innerHTML = '';
    spot.classList.remove('occupied', 'highlight');
    // 清掉上一关停在车位里的车（重置 spot 的内容 + 重建 label）
    // label 初始加上 .entering（在 spot 中央透明），下一帧去掉 → 从车位中央滑上去到顶都 -28px
    // 避免 label 跳出现在 spot 顶都 -28px 位置、看起来像车跑到停车场的左上角
    spot.innerHTML = '<div class="label entering">' + CHINESE[currentNum - 1] + '</div>';
    requestAnimationFrame(() => {
      const lbl = spot.querySelector('.label');
      if (lbl) lbl.classList.remove('entering');
    });
    overlay.classList.remove('show');

    // 提示关闭（两岁多宝宝用大图标、拟声词代替文字提示）
    hintEl.innerHTML = '';

    // 4 台车：1 个正确 + 3 个干扰
    const distractors = pickDistractors(currentNum, 3);
    const cars = shuffle([currentNum, ...distractors]);
    cars.forEach(n => {
      const car = createCar(n);
      carsRow.appendChild(car);
    });

    levelNumEl.textContent = currentNum;
    updateStars();
  }

  function updateStars() {
    // 当前关最多 3 星，按"关数"递减：第 1 关全 3 星、最后一关 1 星
    const remainingStars = Math.max(1, Math.min(TOTAL_STARS, TOTAL_STARS - Math.floor((currentNum - 1) / 4)));
    starsEl.textContent = '⭐'.repeat(remainingStars);
  }

  function createCar(num) {
    const car = document.createElement('div');
    car.className = `car-card ${vehicleFor(num)}`;
    car.dataset.num = num;

    // 不同车型用不同 innerHTML
    const inner = buildVehicleInner(num);
    car.innerHTML = inner + `
      <div class="wheel l"></div>
      <div class="wheel r"></div>
      <div class="plate">${num}</div>
    `;
    car.addEventListener('click', () => handleCar(car));
    return car;
  }

  function buildVehicleInner(num) {
    const cls = vehicleFor(num);
    if (cls === 'v-car') {
      return `<div class="vehicle"></div>`;
    } else if (cls === 'v-fire') {
      return `
        <div class="vehicle">
          <div class="siren"></div>
          <div class="ladder"></div>
          <div class="window"></div>
        </div>`;
    } else if (cls === 'v-police') {
      return `
        <div class="vehicle">
          <div class="siren"></div>
          <div class="top"></div>
          <div class="stripe"></div>
        </div>`;
    } else if (cls === 'v-bus') {
      return `
        <div class="vehicle">
          <div class="window"></div>
          <div class="door"></div>
        </div>`;
    } else if (cls === 'v-ambulance') {
      return `
        <div class="vehicle">
          <div class="top"></div>
          <div class="cross"></div>
          <div class="stripe"></div>
        </div>`;
    } else if (cls === 'v-truck') {
      return `
        <div class="vehicle">
          <div class="cargo"></div>
          <div class="cab"></div>
        </div>`;
    } else if (cls === 'v-excavator') {
      return `
        <div class="vehicle">
          <div class="cabin"></div>
          <div class="arm"></div>
        </div>`;
    } else if (cls === 'v-tractor') {
      return `
        <div class="vehicle">
          <div class="big-wheel"></div>
          <div class="chimney"></div>
          <div class="smoke"></div>
        </div>`;
    } else if (cls === 'v-tanker') {
      return `
        <div class="vehicle">
          <div class="tank"></div>
          <div class="cab"></div>
        </div>`;
    } else if (cls === 'v-taxi') {
      return `
        <div class="vehicle">
          <div class="sign">TAXI</div>
          <div class="top"></div>
        </div>`;
    }
    return `<div class="vehicle"></div>`;
  }

  // ============ 点击车 → 车自己飞过去 ============
  function handleCar(car) {
    if (busy) return;
    const num = parseInt(car.dataset.num, 10);
    if (num === currentNum) {
      flyToSpot(car);
    } else {
      // 错误：摇头 + 抖动后回去
      car.classList.add('shake');
      speak('不对哦', 'zh-CN');
      setTimeout(() => car.classList.remove('shake'), 500);
    }
  }

  function flyToSpot(car) {
    busy = true;
    const fromRect = car.getBoundingClientRect();
    const toRect = spot.getBoundingClientRect();
    car.style.position = 'fixed';
    car.style.left = fromRect.left + 'px';
    car.style.top = fromRect.top + 'px';
    car.style.width = fromRect.width + 'px';
    car.style.height = fromRect.height + 'px';
    car.style.margin = '0';
    requestAnimationFrame(() => {
      car.classList.add('flying');
      car.style.left = (toRect.left + (toRect.width - fromRect.width) / 2) + 'px';
      car.style.top  = (toRect.top + (toRect.height - fromRect.height) / 2) + 'px';
    });
    setTimeout(() => {
      // 车开进车位
      car.classList.remove('flying');
      spot.classList.add('occupied');
      spot.appendChild(car);
      car.style.position = 'absolute';
      car.style.left = (spot.offsetWidth - car.offsetWidth) / 2 + 'px';
      car.style.top  = (spot.offsetHeight - car.offsetHeight) / 2 + 8 + 'px';
      // 不要把 width/height 设 auto。车的所有子元素（车身/轮子/车牌）都是 position: absolute，
      // 不参与车卡 layout flow。如果车卡 width/height 变 auto 会压缩为 0，车身会被挤压到车卡顶部。
      car.style.width = '130px';
      car.style.height = '130px';
      car.style.margin = '0';

      speak('太棒啦', 'zh-CN');
      spawnStars(toRect);

      correctCount++;
      setTimeout(() => {
        if (correctCount >= TOTAL) {
          finale();
        } else {
          // 让车在车位中央原地淡出 + 缩小，再清场进下一关
          // 避免车看起来"瞬移到车位左上角再消失"
          car.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
          car.style.opacity = '0';
          car.style.transform = 'scale(0.5)';
          setTimeout(() => startLevel(), 500);
        }
      }, 1500);
    }, 700);
  }

  function spawnStars(rect) {
    const cx = rect.left + rect.width / 2;
    const cy = rect.top;
    const icons = ['⭐','🌟','✨','💫','🎉'];
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.textContent = icons[i % icons.length];
      s.style.left = (cx + (Math.random() * 80 - 40)) + 'px';
      s.style.top  = (cy + Math.random() * 40) + 'px';
      s.style.position = 'fixed';
      s.style.animationDelay = (i * 80) + 'ms';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 2000);
    }
  }

  // ============ 总通关 ============
  function finale() {
    busy = true;
    // 1. 清掉车位里最后一辆车
    const lastCar = spot.querySelector('.car-card');
    if (lastCar && spot.contains(lastCar)) spot.removeChild(lastCar);

    // 2. 生成 10 辆车，依次从屏幕四周随机飞入中心
    const W = window.innerWidth;
    const H = window.innerHeight;
    const cars = [];
    for (let i = 0; i < 10; i++) {
      const car = createCar(i + 1);
      car.style.position = 'fixed';
      car.style.left = '50%';
      car.style.top  = '50%';
      car.style.width = '110px';
      car.style.height = '110px';
      car.style.transform = 'translate(-50%, -50%) scale(0.3)';
      car.style.transition = 'none';
      car.style.opacity = '0';
      car.style.zIndex = 250;
      car.style.pointerEvents = 'none';
      document.body.appendChild(car);
      cars.push(car);
    }
    finaleCars = cars;  // 存档，againBtn 会清掉

    // 为每辆车随机选一个入场的起点（屏幕边缘）
    const entrySpots = [];
    for (let i = 0; i < 10; i++) {
      const side = i % 4; // 0=上 1=右 2=下 3=左
      let ex, ey;
      const offset = 80 + (i % 3) * 30;
      if (side === 0) { ex = W * (0.15 + 0.7 * ((i / 4 | 0) / 2)); ey = -offset; }
      else if (side === 1) { ex = W + offset; ey = H * (0.2 + 0.6 * ((i / 4 | 0) / 2)); }
      else if (side === 2) { ex = W * (0.7 - 0.7 * ((i / 4 | 0) / 2)); ey = H + offset; }
      else { ex = -offset; ey = H * (0.7 - 0.6 * ((i / 4 | 0) / 2)); }
      entrySpots.push({ ex, ey });
    }

    // 依次飞入（每辆间隔 300ms）
    cars.forEach((car, i) => {
      const { ex, ey } = entrySpots[i];
      setTimeout(() => {
        // 起点：屏幕外
        car.style.left = ex + 'px';
        car.style.top  = ey + 'px';
        car.style.transform = 'translate(-50%, -50%) scale(0.6) rotate(' + ((Math.random() * 60) - 30) + 'deg)';
        car.style.opacity = '1';
        car.style.transition = 'all 0.7s cubic-bezier(0.3, 1.3, 0.4, 1)';
        // 终点：屏幕中心
        requestAnimationFrame(() => {
          car.style.left = '50%';
          car.style.top  = '50%';
          car.style.transform = 'translate(-50%, -50%) scale(1) rotate(0deg)';
        });
      }, i * 300);
    });

    // 3. 全部到齐后（~10*300 + 700 = 3700ms），让 10 辆车围成圆圈转 10 秒
    const STAGE_MS = 3700;
    const SPIN_MS = 10000;       // 转圈 10 秒
    const SPIN_RPS = 3 / 10;     // 3 圈 / 10 秒
    const RADIUS = Math.min(W, H) * 0.28;  // 圆半径：屏幕短边的 28%

    let spinRaf = null;
    setTimeout(() => {
      // 先过渡到圆周起点位置
      const cx = W / 2;
      const cy = H / 2;
      const n = cars.length;
      const startAngles = cars.map((_, i) => (i / n) * Math.PI * 2); // 起始角度均匀分布
      let initialAngle = 0;
      // 设置每辆车到初始位置，启用后续 RAF 转圈
      cars.forEach((car, i) => {
        const a = startAngles[i];
        const x = cx + RADIUS * Math.cos(a);
        const y = cy + RADIUS * Math.sin(a);
        car.style.transition = 'all 0.6s ease-out';
        car.style.left = x + 'px';
        car.style.top  = y + 'px';
        // 车头朝向圆心：旋转 = 角度 + 90°（0° 是车头朝上）
        const deg = a * 180 / Math.PI + 90;
        car.style.transform = 'translate(-50%, -50%) rotate(' + deg + 'deg)';
      });

      // 6. 撒花（表示庆祝）
      setTimeout(spawnConfetti, 200);
      setTimeout(spawnConfetti, 1200);
      setTimeout(spawnConfetti, 2500);

      // 7. 开始转圈（用 RAF 帧驱动）
      const startTime = performance.now();
      function tick(now) {
        const t = (now - startTime) / 1000; // 秒
        const angleOffset = t * SPIN_RPS * Math.PI * 2; // 转过的总角度
        cars.forEach((car, i) => {
          const a = startAngles[i] + angleOffset;
          const x = cx + RADIUS * Math.cos(a);
          const y = cy + RADIUS * Math.sin(a);
          car.style.transition = 'none';
          car.style.left = x + 'px';
          car.style.top  = y + 'px';
          // 车头始终朝向圆心
          const deg = a * 180 / Math.PI + 90;
          car.style.transform = 'translate(-50%, -50%) rotate(' + deg + 'deg)';
        });
        if (now - startTime < SPIN_MS) {
          spinRaf = requestAnimationFrame(tick);
        } else {
          // 转完收尾
          stopSpin();
        }
      }
      // 等过渡完成（600ms）再开始转圈，避免初始 transition 抵消
      setTimeout(() => {
        spinRaf = requestAnimationFrame(tick);
      }, 650);

      function stopSpin() {
        if (spinRaf) cancelAnimationFrame(spinRaf);
        spinRaf = null;
        // 弹通关页
        overlay.classList.add('show');
        speak('太棒啦！全部完成！', 'zh-CN');
        // 不移除车，背景继续转 5 秒作为装饰
        const endTime = performance.now();
        const EXTRA_MS = 5000;
        function tick2(now) {
          const t = (now - endTime) / 1000;
          const angleOffset = t * SPIN_RPS * Math.PI * 2;
          cars.forEach((car, i) => {
            const a = startAngles[i] + angleOffset;
            const x = cx + RADIUS * Math.cos(a);
            const y = cy + RADIUS * Math.sin(a);
            car.style.transition = 'none';
            car.style.left = x + 'px';
            car.style.top  = y + 'px';
            const deg = a * 180 / Math.PI + 90;
            car.style.transform = 'translate(-50%, -50%) rotate(' + deg + 'deg)';
          });
          if (now - endTime < EXTRA_MS) {
            requestAnimationFrame(tick2);
          }
        }
        requestAnimationFrame(tick2);
      }
    }, STAGE_MS);
  }

  function spawnConfetti() {
    const colors = ['#ff7043','#66bb6a','#42a5f5','#ab47bc','#ffd54f','#ec407a'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colors[i % colors.length];
      c.style.left = cx + 'px';
      c.style.top  = cy + 'px';
      c.style.setProperty('--dx', (Math.random() * 600 - 300) + 'px');
      c.style.animationDelay = (Math.random() * 300) + 'ms';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2200);
    }
  }

  againBtn.addEventListener('click', () => {
    // 清除通关后转圈的车
    finaleCars.forEach(c => { if (c.parentNode) c.parentNode.removeChild(c); });
    finaleCars = [];
    correctCount = 0;
    startLevel();
  });

  // 回家按钮也要清车（防止 “回家” 后车还在转）
  document.querySelectorAll('.overlay button.secondary').forEach(btn => {
    btn.addEventListener('click', () => {
      finaleCars.forEach(c => { if (c.parentNode) c.parentNode.removeChild(c); });
      finaleCars = [];
    });
  });

  // ============ 启动 ============
  startLevel();
})();
</script>
</body>
</html>
