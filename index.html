<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宝宝游戏屋 🚂</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%; width: 100%;
    background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 55%, #90ee90 55%, #7ccd7c 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
    overflow-x: hidden;
  }

  /* 装饰：太阳、云、飞机 */
  .sun {
    position: fixed; top: 30px; right: 40px;
    width: 70px; height: 70px;
    background: radial-gradient(circle, #fff59d 30%, #ffd54f 70%);
    border-radius: 50%;
    box-shadow: 0 0 40px #ffe082;
    animation: pulse 3s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

  .cloud {
    position: fixed;
    background: white; border-radius: 50px;
    opacity: 0.85; z-index: 1;
  }
  .cloud::before, .cloud::after {
    content:""; position:absolute;
    background:white; border-radius:50%;
  }
  .cloud1 { width:80px; height:25px; top:60px; left:-10%; animation: drift 40s linear infinite; }
  .cloud1::before { width:40px; height:40px; top:-18px; left:10px; }
  .cloud1::after  { width:50px; height:50px; top:-28px; left:28px; }
  .cloud2 { width:100px; height:28px; top:130px; left:60%; animation: drift 60s linear infinite; }
  .cloud2::before { width:45px; height:45px; top:-20px; left:15px; }
  .cloud2::after  { width:55px; height:55px; top:-30px; left:38px; }
  @keyframes drift { from {transform:translateX(0)} to {transform:translateX(130vw)} }

  .title {
    text-align: center;
    margin: 40px 16px 10px;
    font-size: 38px; font-weight: 900;
    color: #fff;
    text-shadow: 3px 3px 0 #5b8cbe, 5px 5px 10px rgba(0,0,0,0.15);
    letter-spacing: 4px;
    position: relative; z-index: 5;
  }
  .subtitle {
    text-align: center;
    color: #fff;
    font-size: 18px; font-weight: 700;
    text-shadow: 2px 2px 0 #5b8cbe;
    margin-bottom: 30px;
    position: relative; z-index: 5;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    position: relative; z-index: 5;
  }

  .card {
    background: linear-gradient(180deg, #fff 0%, #fff8e1 100%);
    border: 5px solid #5d4037;
    border-radius: 28px;
    padding: 24px 20px 20px;
    text-decoration: none;
    color: #5d4037;
    cursor: pointer;
    box-shadow: 0 8px 0 #5d4037, 0 12px 24px rgba(0,0,0,0.25);
    transition: transform 0.15s;
    display: flex; flex-direction: column;
    align-items: center;
    min-height: 260px;
  }
  .card:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #5d4037, 0 4px 8px rgba(0,0,0,0.25);
  }

  .card .emoji {
    font-size: 96px;
    margin-bottom: 12px;
    animation: bob 2s ease-in-out infinite;
  }
  .card:nth-child(2) .emoji { animation-delay: 0.3s; }
  .card:nth-child(3) .emoji { animation-delay: 0.6s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .card h2 {
    margin: 0 0 8px;
    font-size: 26px; font-weight: 900;
    color: #d35400;
  }
  .card .tag {
    display: inline-block;
    padding: 4px 10px;
    background: #ff7043;
    color: white;
    border-radius: 12px;
    font-size: 12px; font-weight: 700;
    margin-bottom: 10px;
  }
  .card p {
    margin: 0;
    font-size: 15px; font-weight: 700;
    color: #8d6e63;
    line-height: 1.5;
    text-align: center;
  }
  .card.train { background: linear-gradient(180deg, #ffe0b2 0%, #ffcc80 100%); }
  .card.train h2 { color: #bf360c; }
  .card.parking { background: linear-gradient(180deg, #c8e6c9 0%, #a5d6a7 100%); }
  .card.parking h2 { color: #1b5e20; }
  .card.bridge { background: linear-gradient(180deg, #bbdefb 0%, #90caf9 100%); }
  .card.bridge h2 { color: #0d47a1; }

  .footer {
    text-align: center;
    padding: 30px 16px;
    color: #fff;
    font-size: 14px;
    text-shadow: 1px 1px 0 #5b8cbe;
    position: relative; z-index: 5;
  }

  /* 飘过的小车 */
  .mini-car {
    position: fixed;
    bottom: 20px;
    font-size: 36px;
    animation: car-drive 18s linear infinite;
    z-index: 2;
    pointer-events: none;
    opacity: 0.7;
  }
  @keyframes car-drive {
    from { transform: translateX(-10vw); }
    to   { transform: translateX(110vw); }
  }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <h1 class="title">🚂 宝宝游戏屋</h1>
  <p class="subtitle">学字母 · 学数字 · 玩中学 🧸</p>

  <div class="grid">
    <a class="card train" href="./games/train-alphabet/">
      <div class="emoji">🚂</div>
      <div class="tag">字母 · 拼音</div>
      <h2>小火车拼字母</h2>
      <p>把字母车厢一节节拼到火车上，让小火车出发！</p>
    </a>

    <a class="card parking" href="./games/parking/">
      <div class="emoji">🅿️</div>
      <div class="tag">字母 · 数字</div>
      <h2>停车场找车位</h2>
      <p>把小车开到对应的字母/数字车位停好～</p>
    </a>

    <a class="card bridge" href="./games/bridge/">
      <div class="emoji">🌉</div>
      <div class="tag">字母 · 数字</div>
      <h2>小车过字母桥</h2>
      <p>小车要过桥，点对字母门才能开过去！</p>
    </a>
  </div>

  <div class="footer">给小朋友们做的游戏 · 跨设备都能玩 💕</div>

  <div class="mini-car">🚗</div>
  <script>
    // 随机生成几辆飘过的小车
    const cars = ['🚗','🚕','🚙','🚌'];
    const used = ['🚗'];
    for (let i = 1; i < 3; i++) {
      const c = document.createElement('div');
      c.className = 'mini-car';
      c.textContent = cars[i];
      c.style.animationDuration = (14 + Math.random()*8) + 's';
      c.style.animationDelay = (-Math.random()*10) + 's';
      c.style.bottom = (10 + Math.random()*30) + 'px';
      document.body.appendChild(c);
    }
  </script>
</body>
</html>
